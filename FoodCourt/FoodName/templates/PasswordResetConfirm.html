{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password - CraveBite</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <section class="forgot-password-page">

        <div class="forgot-password-card">

            <div class="forgot-password-icon">
                🔐
            </div>

            <h1>Set New Password</h1>

            <p>
                Enter your new password below.
            </p>

            <form method="POST">

                {% csrf_token %}

                <div class="forgot-password-field">

                    <label for="id_new_password1">
                        New Password
                    </label>

                    <input
                        type="password"
                        name="new_password1"
                        id="id_new_password1"
                        placeholder="Enter new password"
                        required
                    >

                </div>

                <div class="forgot-password-field">

                    <label for="id_new_password2">
                        Confirm New Password
                    </label>

                    <input
                        type="password"
                        name="new_password2"
                        id="id_new_password2"
                        placeholder="Confirm new password"
                        required
                    >

                </div>

                {% if messages %}
                    {% for message in messages %}
                        <div class="password-reset-errors">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}

                <button type="submit">
                    Reset Password
                </button>

            </form>

            <a href="{% url 'login' %}" class="back-to-login">
                ← Back to Login
            </a>

        </div>

    </section>

</body>

</html>
