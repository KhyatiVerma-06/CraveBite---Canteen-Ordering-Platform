{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CraveBite | Sign Up</title>

    <link rel="stylesheet"
          href="{% static 'css/style.css' %}">

</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            <img src="{% static 'images/Logo.png' %}"
                 alt="CraveBite Logo">
        </div>

        <div class="nav-links">

            <a href="{% url 'home' %}">
                Home
            </a>

            <a href="{% url 'menu' %}">
                Menu
            </a>

            <a href="{% url 'offers' %}">
                Offers
            </a>

            <a href="{% url 'about' %}">
                About
            </a>

        </div>

        <div class="nav-buttons">

            <a href="{% url 'login' %}"
               class="login-btn">
                Login
            </a>

            <a href="{% url 'signup' %}"
               class="cart-btn">
                Sign Up
            </a>

        </div>

    </nav>


    <!-- SIGN UP -->

    <section class="signup-page">

        <div class="signup-box">

            <h1>Create Account</h1>

            <p>
                Join CraveBite and satisfy your cravings.
            </p>


            <form>

                <div class="form-group">

                    <label>Full Name</label>

                    <input
                        type="text"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Email Address</label>

                    <input
                        type="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Password</label>

                    <input
                        type="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Confirm Password</label>

                    <input
                        type="password"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <button type="submit"
                        class="signup-submit">
                    Create Account
                </button>

            </form>


            <p class="login-text">

                Already have an account?

                <a href="{% url 'login' %}">
                    Login
                </a>

            </p>

        </div>

    </section>

</body>

</html>
