{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - CraveBite</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <section class="forgot-password-page">

        <div class="forgot-password-card">

            <div class="forgot-password-icon">
                🔐
            </div>

            <h1>Forgot Password?</h1>

            <p>
                Enter your registered email address
                to reset your password.
            </p>

            <form method="POST">

                {% csrf_token %}

                <div class="forgot-password-field">

                    <label for="id_email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        name="email"
                        id="id_email"
                        placeholder="Enter your email"
                        required
                    >

                </div>

                <button type="submit">
                    Continue
                </button>

            </form>

            <a href="{% url 'login' %}" class="back-to-login">
                ← Back to Login
            </a>

        </div>

    </section>

</body>

</html>
