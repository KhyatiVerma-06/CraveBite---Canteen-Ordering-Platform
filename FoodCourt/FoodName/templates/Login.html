{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CraveBite | Login</title>

    <link rel="stylesheet"
          href="{% static 'css/style.css' %}">

</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            <img src="{% static 'images/Logo.png' %}"
                 alt="CraveBite Logo">
        </div>

        <div class="nav-links">

            <a href="{% url 'home' %}">
                Home
            </a>

            <a href="{% url 'menu' %}">
                Menu
            </a>

            <a href="{% url 'offers' %}">
                Offers
            </a>

            <a href="{% url 'about' %}">
                About
            </a>

        </div>

        <div class="nav-buttons">
            <a href="{% url 'login' %}" class="login-btn">Login</a>
            <a href="{% url 'signup' %}" class="cart-btn">Sign Up</a>

        </div>

    </nav>


    <!-- LOGIN -->

    <section class="login-page">

        <div class="login-box">

            <h1>Welcome Back!</h1>

            <p>
                Login to continue your CraveBite journey.
            </p>


            <form>

                <div class="form-group">

                    <label>Email Address</label>

                    <input
                        type="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Password</label>

                    <input
                        type="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <div class="login-options">

                    <label>
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <button type="submit"
                        class="login-submit">
                    Login
                </button>

            </form>


            <p class="signup-text">

                Don't have an account?

                <a href="{% url 'signup' %}">Sign Up</a>

            </p>

        </div>

    </section>

</body>

</html>
